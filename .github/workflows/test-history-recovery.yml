name: Test canyon historical evidence recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-history-recovery.yml"
      - "cca-radar-tracker/tools/restore_historical_model_evidence.py"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: cca-radar-tracker
        run: pip install -r requirements.txt
      - name: Audit selected known-good backups
        run: |
          python - <<'PY'
          import json, urllib.request

          targets = ['neon', 'no-kidding', 'woody', 'angel-cove', 'hog-canyons']
          dates = ['2026-08-20','2026-08-24','2026-08-26','2026-08-29','2026-08-31']
          base = 'https://raw.githubusercontent.com/canyoncountryadventure/cca-radar-tracker/operational-data/backups/{}/status.json'

          for date in dates:
              print('\nSNAPSHOT', date)
              with urllib.request.urlopen(base.format(date), timeout=120) as r:
                  status = json.load(r)
              for canyon_id in targets:
                  c = status['canyons'][canyon_id]
                  events = c.get('events') or []
                  strongest = max(events, key=lambda e: float(e.get('direct_runoff_ft3') or 0), default={})
                  rec = (c.get('historical_records') or {}).get('peak_individual_event') or {}
                  print(canyon_id,
                        'last_checked=', status.get('last_checked_utc'),
                        'strongest=', strongest.get('start_utc'),
                        'runoff=', strongest.get('direct_runoff_ft3'),
                        'class=', strongest.get('classification'),
                        'record_ratio=', rec.get('fill_ratio'))
          PY
      - name: Fetch current operational state
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/canyoncountryadventure/cca-radar-tracker/operational-data/latest/status.json \
            -o /tmp/status.json
      - name: Restore current evidence and verify core recovery mechanism
        working-directory: cca-radar-tracker
        run: |
          python tools/restore_historical_model_evidence.py --status /tmp/status.json
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('/tmp/status.json').read_text())
          targets = ['neon', 'no-kidding', 'woody', 'angel-cove', 'hog-canyons']
          evidence = status.get('historical_model_evidence') or {}
          assert evidence.get('event_count', 0) > 0
          for canyon_id in targets:
              historical = [e for e in status['canyons'][canyon_id].get('events') or [] if e.get('historical_model_evidence')]
              assert historical, f'{canyon_id}: no recovered events'
          print('core recovery mechanism verified for all five target canyons')
          PY
