name: Test canyon historical evidence recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-history-recovery.yml"
      - "cca-radar-tracker/tools/restore_historical_model_evidence.py"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: cca-radar-tracker
        run: pip install -r requirements.txt
      - name: Fetch current operational state
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/canyoncountryadventure/cca-radar-tracker/operational-data/latest/status.json \
            -o /tmp/status.json
          stat -c 'BEFORE_SIZE=%s' /tmp/status.json
      - name: Restore and verify compact historical evidence
        working-directory: cca-radar-tracker
        run: |
          python tools/restore_historical_model_evidence.py --status /tmp/status.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/status.json')
          status = json.loads(path.read_text())
          evidence = status['historical_model_evidence']
          assert evidence['schema_version'] == 3
          assert set(x['label'] for x in evidence['sources']) == {'2026-08-24','2026-08-31'}
          assert path.stat().st_size < 55_000_000, f'status still bloated: {path.stat().st_size}'

          serialized_evidence = json.dumps(evidence)
          assert '_zlib' not in serialized_evidence
          assert 'grid_dbz' not in serialized_evidence

          def max_runoff(canyon_id, start_prefix):
              matches = [
                  e for e in status['canyons'][canyon_id].get('events') or []
                  if str(e.get('start_utc','')).startswith(start_prefix)
                  and e.get('historical_model_evidence')
              ]
              assert matches, f'{canyon_id} {start_prefix}: historical event missing'
              best = max(matches, key=lambda e: float(e.get('direct_runoff_ft3') or 0))
              print(canyon_id, start_prefix, best.get('direct_runoff_ft3'), best.get('classification'), best.get('historical_model_source'))
              return float(best.get('direct_runoff_ft3') or 0)

          assert max_runoff('neon','2026-08-30') >= 162775
          assert max_runoff('woody','2026-08-30') >= 245843
          assert max_runoff('angel-cove','2026-08-23') >= 145917

          for canyon_id in ['neon','no-kidding','woody','angel-cove','hog-canyons']:
              historical = [e for e in status['canyons'][canyon_id].get('events') or [] if e.get('historical_model_evidence')]
              assert historical, f'{canyon_id}: no historical events restored'
          print('compact multi-snapshot recovery verified; bytes=', path.stat().st_size)
          PY
