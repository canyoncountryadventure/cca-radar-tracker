name: Test canyon historical evidence recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-history-recovery.yml"
      - "cca-radar-tracker/tools/restore_historical_model_evidence.py"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: cca-radar-tracker
        run: pip install -r requirements.txt
      - name: Fetch current operational state
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/canyoncountryadventure/cca-radar-tracker/operational-data/latest/status.json \
            -o /tmp/status.json
      - name: Restore and verify historical evidence
        working-directory: cca-radar-tracker
        run: |
          python tools/restore_historical_model_evidence.py --status /tmp/status.json
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('/tmp/status.json').read_text())
          targets = ['neon', 'no-kidding', 'woody', 'angel-cove', 'hog-canyons']
          evidence = status.get('historical_model_evidence') or {}
          assert evidence.get('event_count', 0) > 0, evidence
          print('evidence_count', evidence.get('event_count'))
          print('authoritative_through', evidence.get('authoritative_through_utc'))

          for canyon_id in targets:
              c = status['canyons'][canyon_id]
              historical = [e for e in (c.get('events') or []) if e.get('historical_model_evidence')]
              assert historical, f'{canyon_id}: no recovered historical events'
              strongest = max(historical, key=lambda e: float(e.get('direct_runoff_ft3') or 0))
              print(
                  canyon_id,
                  'historical_events=', len(historical),
                  'strongest_start=', strongest.get('start_utc'),
                  'runoff_ft3=', strongest.get('direct_runoff_ft3'),
                  'class=', strongest.get('classification'),
                  'condition=', (c.get('condition_estimate') or {}).get('current_condition'),
              )

          def event_runoff(canyon_id, start_prefix):
              matches = [
                  e for e in status['canyons'][canyon_id].get('events') or []
                  if str(e.get('start_utc', '')).startswith(start_prefix)
                  and e.get('historical_model_evidence')
              ]
              return max((float(e.get('direct_runoff_ft3') or 0) for e in matches), default=0.0)

          assert event_runoff('neon', '2026-08-30') >= 140787, 'Neon Aug 30 runoff evidence missing'
          assert event_runoff('woody', '2026-08-30') >= 245843, 'Woody Aug 30 runoff evidence missing'
          assert event_runoff('angel-cove', '2026-08-23') >= 117010, 'Angel Cove Aug 23 runoff evidence missing'
          print('verified known refill events')
          PY
