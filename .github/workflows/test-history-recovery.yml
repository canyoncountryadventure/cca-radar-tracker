name: Test canyon historical evidence recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-history-recovery.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: cca-radar-tracker
        run: pip install -r requirements.txt
      - name: Fetch current operational state
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/canyoncountryadventure/cca-radar-tracker/operational-data/latest/status.json \
            -o /tmp/status.json
      - name: Restore and verify historical evidence
        working-directory: cca-radar-tracker
        run: |
          python tools/restore_historical_model_evidence.py --status /tmp/status.json
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('/tmp/status.json').read_text())
          targets = ['neon', 'no-kidding', 'woody', 'angel-cove', 'hog-canyons']
          evidence = status.get('historical_model_evidence') or {}
          assert evidence.get('event_count', 0) > 0, evidence
          print('evidence_count', evidence.get('event_count'))
          print('authoritative_through', evidence.get('authoritative_through_utc'))
          for canyon_id in targets:
              c = status['canyons'][canyon_id]
              events = c.get('events') or []
              historical = [e for e in events if e.get('historical_model_evidence')]
              print(canyon_id, 'historical_events=', len(historical),
                    'condition=', (c.get('condition_estimate') or {}).get('current_condition'),
                    'percent=', (c.get('condition_estimate') or {}).get('current_percent_full'))
              assert historical, f'{canyon_id}: no recovered historical events'

          def find_ratio(canyon_id, start_prefix):
              for event in status['canyons'][canyon_id].get('events') or []:
                  if str(event.get('start_utc', '')).startswith(start_prefix):
                      return float(event.get('fill_ratio') or event.get('storage_ratio') or 0)
              return 0.0

          assert find_ratio('neon', '2026-08-30') >= 1.26, 'Neon Aug 30 refill evidence missing'
          assert find_ratio('woody', '2026-08-30') >= 7.44, 'Woody Aug 30 refill evidence missing'
          assert find_ratio('angel-cove', '2026-08-23') >= 3.43, 'Angel Cove Aug 23 refill evidence missing'
          print('verified known refill events')
          PY
