name: Audit Zero G field storms

on:
  push:
    branches: [main]
    paths:
      - 'cca-radar-tracker/tools/audit_zerog_field_storms.py'
      - '.github/workflows/audit-zerog-field-storms.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: cca-radar-tracker
        run: python -m pip install -r requirements.txt
      - name: Audit historical storms
        working-directory: cca-radar-tracker
        run: python tools/audit_zerog_field_storms.py
      - name: Commit audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cca-radar-tracker/docs/data/zerog_field_calibration.json cca-radar-tracker/docs/zerog-field-calibration.md
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "Update Zero G field storm calibration audit"
            git push
          fi
