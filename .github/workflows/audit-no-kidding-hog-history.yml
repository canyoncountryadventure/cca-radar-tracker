name: Audit No Kidding and Hog history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-no-kidding-hog-history.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Scan every durable August backup
        run: |
          python - <<'PY'
          import json, urllib.request
          from datetime import date, timedelta

          base = 'https://raw.githubusercontent.com/canyoncountryadventure/cca-radar-tracker/operational-data/backups/{}/status.json'
          targets = ['no-kidding','hog-canyons']
          best = {cid: {'runoff': -1, 'date': None, 'event': None, 'ratio': None, 'class': None} for cid in targets}
          meaningful = {cid: [] for cid in targets}

          d = date(2026,8,3)
          end = date(2026,8,31)
          scanned = 0
          missing = []
          while d <= end:
              ds = d.isoformat()
              url = base.format(ds)
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'CCA-history-audit/1.1'})
                  with urllib.request.urlopen(req, timeout=120) as r:
                      status = json.load(r)
              except Exception as exc:
                  missing.append((ds, type(exc).__name__))
                  d += timedelta(days=1)
                  continue
              scanned += 1
              for cid in targets:
                  c = status['canyons'][cid]
                  events = list(c.get('events') or [])
                  for key in ('last_rain_event','last_qualifying_event'):
                      if c.get(key): events.append(c[key])
                  rec = (c.get('historical_records') or {}).get('peak_individual_event') or {}
                  if rec.get('start_utc'):
                      events.append({
                          'start_utc': rec.get('start_utc'),
                          'end_utc': rec.get('end_utc'),
                          'direct_runoff_ft3': rec.get('direct_runoff_ft3'),
                          'fill_ratio': rec.get('fill_ratio'),
                          'classification': rec.get('classification') or rec.get('classification_label')
                      })
                  for e in events:
                      runoff = float(e.get('direct_runoff_ft3') or e.get('generated_runoff_ft3') or 0)
                      ratio = float(e.get('fill_ratio') or e.get('storage_ratio') or e.get('cumulative_ratio') or 0)
                      if runoff > best[cid]['runoff']:
                          best[cid] = {
                              'runoff': runoff,
                              'date': ds,
                              'event': e.get('start_utc'),
                              'end': e.get('end_utc'),
                              'ratio': ratio,
                              'class': e.get('classification') or e.get('classification_label')
                          }
                      if runoff >= 5000 or ratio >= 0.10 or str(e.get('classification') or '') in ('moderate','likely_full','full_flush'):
                          meaningful[cid].append((ds, e.get('start_utc'), runoff, ratio, e.get('classification')))
              d += timedelta(days=1)

          print('SCANNED_BACKUPS', scanned)
          print('MISSING_DATES', missing)
          for cid in targets:
              print('BEST', cid, json.dumps(best[cid], sort_keys=True))
              unique = []
              seen = set()
              for row in meaningful[cid]:
                  key = row[1:]
                  if key not in seen:
                      seen.add(key); unique.append(row)
              print('MEANINGFUL', cid, json.dumps(unique, default=str))
          PY
