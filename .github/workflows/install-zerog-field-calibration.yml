name: Install Zero G field calibration

on:
  push:
    branches: [main]
    paths:
      - 'cca-radar-tracker/tools/install_zerog_field_calibration.py'
      - '.github/workflows/install-zerog-field-calibration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: cca-radar-tracker
        run: python -m pip install -r requirements.txt
      - name: Install calibration
        working-directory: cca-radar-tracker
        run: python tools/install_zerog_field_calibration.py
      - name: Add calibration regression tests
        working-directory: cca-radar-tracker
        run: |
          cat > tests/test_zerog_field_calibration.py <<'PY'
          import unittest
          from types import SimpleNamespace
          import numpy as np
          import tracker

          class ZeroGFieldCalibrationTests(unittest.TestCase):
              def canyon(self):
                  return SimpleNamespace(
                      canyon_id='zerog',
                      weights=np.ones((1, 1), dtype=float),
                  )

              def evidence(self, inches):
                  return tracker.zero_g_field_core_evidence(
                      {'accumulated_rain_grid_inches': [[inches]]}, self.canyon()
                  )

              def test_small_anchor_stays_below_major(self):
                  self.assertFalse(self.evidence(0.0779)['major_threshold_met'])

              def test_aug12_anchor_meets_major(self):
                  evidence = self.evidence(0.2123)
                  self.assertTrue(evidence['major_threshold_met'])
                  self.assertFalse(evidence['flush_threshold_met'])

              def test_aug29_anchor_major_not_flush(self):
                  evidence = self.evidence(0.5101)
                  self.assertTrue(evidence['major_threshold_met'])
                  self.assertFalse(evidence['flush_threshold_met'])

              def test_aug30_anchor_meets_flush(self):
                  self.assertTrue(self.evidence(1.1051)['flush_threshold_met'])

              def test_aug31_secondary_rise_does_not_force_refill(self):
                  self.assertFalse(self.evidence(0.0574)['major_threshold_met'])

              def test_spatial_runoff_preserves_local_core(self):
                  canyon = SimpleNamespace(
                      canyon_id='zerog',
                      weights=np.array([[0.5, 0.5]], dtype=float),
                  )
                  event = {'accumulated_rain_grid_inches': [[0.0, 0.20]]}
                  spatial = tracker.spatial_nrcs_runoff_depth(event, canyon, 88.6)
                  lumped = tracker.nrcs_runoff_depth(0.10, 88.6)
                  self.assertIsNotNone(spatial)
                  self.assertGreater(spatial, lumped)

          if __name__ == '__main__':
              unittest.main()
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_event_accumulation.py')
          text = path.read_text(encoding='utf-8')
          old = '''        self.assertEqual(refreshed["storage_target_ft3"], 104_884)\n        self.assertAlmostEqual(\n            refreshed["fill_ratio"], original["fill_ratio"] / 2, places=4\n        )\n'''
          new = '''        self.assertEqual(refreshed["storage_target_ft3"], 104_884)\n        self.assertEqual(refreshed["direct_runoff_ft3"], original["direct_runoff_ft3"])\n        self.assertEqual(\n            refreshed["fill_ratio"],\n            round(refreshed["direct_runoff_ft3"] / 104_884, 2),\n        )\n'''
          if old not in text:
              raise SystemExit('storage-target recalculation test marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run tests
        working-directory: cca-radar-tracker
        run: python -m unittest discover -s tests -v
      - name: Compile tracker
        working-directory: cca-radar-tracker
        run: python -m py_compile tracker.py
      - name: Commit installed calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cca-radar-tracker/tracker.py cca-radar-tracker/tests/test_zerog_field_calibration.py cca-radar-tracker/tests/test_event_accumulation.py
          if git diff --cached --quiet; then
            echo "Calibration already installed"
          else
            git commit -m "Calibrate Zero G runoff with field logger anchors"
            git push
          fi
