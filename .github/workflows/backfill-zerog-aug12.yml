name: Backfill Zero G Aug 12

on:
  push:
    branches: [main]
    paths:
      - 'cca-radar-tracker/tools/backfill_zerog_aug12.py'
      - 'cca-radar-tracker/tools/export_zerog_aug12_event.py'
      - 'cca-radar-tracker/tools/merge_zerog_aug12_event.py'
      - '.github/workflows/backfill-zerog-aug12.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: zerog-aug12-history-recovery
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: cca-radar-tracker
        run: python -m pip install -r requirements.txt
      - name: Reconstruct exact Aug 12 event independently
        working-directory: cca-radar-tracker
        run: python tools/export_zerog_aug12_event.py --output /tmp/zerog_aug12_event.json
      - name: Merge only the recovered event into latest operational state
        env:
          DATA_BRANCH: operational-data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          worktree="$(mktemp -d)"
          git fetch origin "$DATA_BRANCH:$DATA_BRANCH"
          git worktree add "$worktree" "$DATA_BRANCH"

          python cca-radar-tracker/tools/merge_zerog_aug12_event.py \
            --status "$worktree/latest/status.json" \
            --event /tmp/zerog_aug12_event.json

          recovery="$(python - "$worktree/latest/status.json" <<'PY'
          import json, sys
          status = json.load(open(sys.argv[1]))
          r = status.get('field_history_recovery', {}).get('zerog_aug12_2026', {})
          if not r.get('ok') or r.get('classification') != 'likely_full':
              raise SystemExit('recovery verification failed')
          print(f"{r['basin_rain_inches']} in basin rain; {r['maximum_in_basin_storm_inches']} in core; {r['classification']}")
          PY
          )"
          echo "Verified: $recovery"

          backup_date="$(date -u +%F)"
          mkdir -p "$worktree/backups/$backup_date"
          cp "$worktree/latest/status.json" "$worktree/backups/$backup_date/status.json"
          git -C "$worktree" add latest/status.json "backups/$backup_date/status.json"
          if git -C "$worktree" diff --cached --quiet; then
            echo 'Operational state already contains recovery'
          else
            git -C "$worktree" commit -m 'Recover Zero G Aug 12 field-observed storm'
            git -C "$worktree" push origin "$DATA_BRANCH"
          fi
          git worktree remove "$worktree"
      - name: Queue production refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-radar.yml --repo "$GITHUB_REPOSITORY" --ref main
