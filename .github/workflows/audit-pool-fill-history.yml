name: Verify live refill-history rows

on:
  push:
    branches:
      - audit-pool-fill-20260929
    paths:
      - ".github/workflows/audit-pool-fill-history.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify UI refill-history rows
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 90             --header "Cache-Control: no-cache"             "https://canyoncountryadventure.github.io/cca-radar-tracker/data/status.json?history=$(date +%s)"             -o /tmp/status.json
          python - <<'PY'
          import json
          s=json.load(open('/tmp/status.json'))
          checks={
            'alcatraz':'2026-09-02T15:20:00Z',
            'poe':'2026-09-02T17:50:00Z',
          }
          for cid,start in checks.items():
              rows=s['canyons'][cid].get('refill_history') or []
              match=next((r for r in rows if r.get('start_utc')==start),None)
              if not match:
                  raise SystemExit(f'UI REFILL HISTORY MISSING: {cid} {start}')
              print('UI ROW',cid,json.dumps(match,sort_keys=True))
          PY
