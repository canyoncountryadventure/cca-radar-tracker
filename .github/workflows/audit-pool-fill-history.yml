name: Inspect live Alcatraz and Poe Sept 2 history

on:
  push:
    branches:
      - audit-pool-fill-20260929
    paths:
      - ".github/workflows/audit-pool-fill-history.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print Sept 2 live events
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 90             --header "Cache-Control: no-cache"             "https://canyoncountryadventure.github.io/cca-radar-tracker/data/status.json?inspect=$(date +%s)"             -o /tmp/status.json
          python - <<'PY'
          import json
          s=json.load(open('/tmp/status.json'))
          for cid in ('alcatraz','poe'):
              print('CANYON',cid)
              c=s['canyons'][cid]
              for e in c.get('events') or []:
                  if str(e.get('start_utc','')).startswith('2026-09-02') or str(e.get('end_utc','')).startswith('2026-09-02'):
                      keep={k:e.get(k) for k in (
                        'start_utc','end_utc','basin_rain_inches','max_pixel_storm_inches',
                        'direct_runoff_ft3','generated_runoff_ft3','fill_ratio','classification',
                        'classification_label','peak_dbz','peak_frame_utc','history_recovered_from_raw_radar'
                      )}
                      print(json.dumps(keep, sort_keys=True))
              print('LAST_QUAL',json.dumps(c.get('last_qualifying_event'), sort_keys=True)[:3000])
              print('PEAK',json.dumps((c.get('historical_records') or {}).get('peak_individual_event'), sort_keys=True)[:3000])
          PY
