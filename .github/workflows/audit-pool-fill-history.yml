name: Audit pool-fill history

on:
  push:
    branches:
      - audit-pool-fill-20260929
    paths:
      - ".github/workflows/audit-pool-fill-history.yml"
      - "cca-radar-tracker/tools/audit_pool_fill_history.py"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: cca-radar-tracker
        run: pip install -r requirements.txt
      - name: Audit Alcatraz, Hog Canyons, and Poe since August 1
        working-directory: cca-radar-tracker
        run: python tools/audit_pool_fill_history.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pool-fill-history-audit
          path: cca-radar-tracker/audit_pool_fill_history_report.json
          if-no-files-found: warn
