name: Verify live Alcatraz and Poe recovery

on:
  push:
    branches:
      - audit-pool-fill-20260929
    paths:
      - ".github/workflows/audit-pool-fill-history.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live published events
        run: |
          set -euo pipefail
          url="https://canyoncountryadventure.github.io/cca-radar-tracker/data/status.json?verify=$(date +%s)"
          curl --fail --silent --show-error --location --max-time 90             --header "Cache-Control: no-cache"             --header "Pragma: no-cache"             "$url" -o /tmp/status.json
          python - <<'PY'
          import json
          status = json.load(open('/tmp/status.json'))
          checks = {
              "alcatraz": ("2026-09-02T15:20:00Z", 4.45),
              "poe": ("2026-09-02T17:50:00Z", 2.36),
          }
          for cid, (start, minimum_ratio) in checks.items():
              events = status["canyons"][cid].get("events") or []
              match = next((e for e in events if e.get("start_utc") == start), None)
              if not match:
                  raise SystemExit(f"LIVE MISSING: {cid} {start}")
              ratio = float(match.get("fill_ratio") or 0)
              cls = match.get("classification")
              if ratio < minimum_ratio or cls != "full_flush":
                  raise SystemExit(f"LIVE BAD EVENT: {cid} ratio={ratio} class={cls}")
              print(
                  f"LIVE OK {cid}: start={start}; ratio={ratio}; "
                  f"class={cls}; rain={match.get('basin_rain_inches')}; "
                  f"runoff={match.get('direct_runoff_ft3')}"
              )
          PY
