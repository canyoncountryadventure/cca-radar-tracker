name: Install all-canyon logger loss model

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-zerog-loss-model.yml'
      - 'cca-radar-tracker/tools/finalize_all_canyon_loss.py'
      - 'cca-radar-tracker/tools/update_zero_g_calibration_tests.py'
      - 'cca-radar-tracker/tools/apply_per_canyon_recession.py'
      - 'cca-radar-tracker/tools/fix_recession_frontend_copy.py'
      - 'cca-radar-tracker/loss_model.py'
      - 'cca-radar-tracker/README.md'
      - 'cca-radar-tracker/tests/test_loss_model.py'
      - 'cca-radar-tracker/tests/test_frontend_contract.py'
      - 'cca-radar-tracker/tests/test_event_accumulation.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cca-radar-tracker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update tests for current field anchor
        run: python tools/update_zero_g_calibration_tests.py

      - name: Apply one-time field calibration when needed
        run: |
          if grep -q 'ZERO_G_REFERENCE_LOWER_POOL_DEPTH_FT = 11.9288' loss_model.py || grep -q '"percent": 98' tracker.py; then
            python tools/finalize_all_canyon_loss.py
          else
            echo "13.0-ft Zero G field calibration already installed; skipping legacy one-time finalizer."
          fi

      - name: Apply per-canyon recession clocks and monthly rates when needed
        run: |
          if grep -q 'def zero_g_monthly_recession_table' loss_model.py && grep -q '"last_refill_utc"' tracker.py && grep -q 'monthlyRecessionRows' docs/app.js; then
            echo "Positive-runoff per-canyon clocks and 12-month recession model already installed; skipping one-time structural patch."
          else
            python tools/apply_per_canyon_recession.py
          fi

      - name: Finish recession front-end copy
        run: python tools/fix_recession_frontend_copy.py

      - name: Run backend tests
        run: python -m unittest discover -s tests -v

      - name: Check front-end JavaScript
        run: node --check docs/app.js

      - name: Commit calibrated model and documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loss_model.py tracker.py docs/app.js README.md tools/finalize_all_canyon_loss.py tools/update_zero_g_calibration_tests.py tools/apply_per_canyon_recession.py tools/fix_recession_frontend_copy.py tests/test_loss_model.py tests/test_tracker.py tests/test_event_accumulation.py tests/test_frontend_contract.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply per-canyon monthly recession model"
            git push origin main
          fi
