name: Install Zero G logger loss model

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-zerog-loss-model.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cca-radar-tracker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply logger-calibrated loss model
        run: python tools/install_zerog_loss_model.py

      - name: Run backend tests
        run: python -m unittest discover -s tests -v

      - name: Check front-end JavaScript
        run: node --check docs/app.js

      - name: Commit calibrated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker.py docs/app.js tests/test_tracker.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply Zero G MX2001 ET plus Navajo loss calibration"
            git push origin main
          fi
