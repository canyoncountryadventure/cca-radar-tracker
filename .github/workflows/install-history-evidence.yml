name: Install historical canyon evidence restoration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-history-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install restoration hook into tracker runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('cca-radar-tracker/tracker.py')
          text = path.read_text(encoding='utf-8')

          if 'import subprocess\n' not in text:
              text = text.replace('import sys\n', 'import sys\nimport subprocess\n', 1)

          original = '            save_json(arguments.status, status)\n'
          replacement = '''            save_json(arguments.status, status)\n            subprocess.run(\n                [sys.executable, str(ROOT / "tools/restore_historical_model_evidence.py"),\n                 "--status", str(arguments.status)],\n                check=True,\n            )\n'''
          if replacement not in text:
              if original not in text:
                  raise SystemExit('Could not locate one-frame status save in tracker.py')
              text = text.replace(original, replacement, 1)

          original_final = '    save_json(arguments.status, status)\n    print(\n        f"Radar reconciliation completed; {processed}/{len(timestamps)} frames "\n'
          replacement_final = '''    save_json(arguments.status, status)\n    subprocess.run(\n        [sys.executable, str(ROOT / "tools/restore_historical_model_evidence.py"),\n         "--status", str(arguments.status)],\n        check=True,\n    )\n    print(\n        f"Radar reconciliation completed; {processed}/{len(timestamps)} frames "\n'''
          if replacement_final not in text:
              if original_final not in text:
                  raise SystemExit('Could not locate scheduled-run status save in tracker.py')
              text = text.replace(original_final, replacement_final, 1)

          path.write_text(text, encoding='utf-8')
          print('Installed runtime historical-evidence restoration hook.')
          PY

      - name: Commit tracker runtime change
        run: |
          set -euo pipefail
          if git diff --quiet -- cca-radar-tracker/tracker.py; then
            echo "No tracker change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cca-radar-tracker/tracker.py
          git commit -m "Preserve original canyon storm evidence on every radar run"
          git push origin HEAD:main
